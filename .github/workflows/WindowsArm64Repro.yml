name: Windows ARM64 crash repro
# Builds DuckDB + extensions the same way the "Main Extensions / Windows (windows_arm64)" job does
# (extension-template + extension-ci-tools@v1.5-variegata, merged vcpkg manifest, arm64-windows-static-release),
# then runs the extension test suite in a loop within the same job, to reproduce intermittent crashes.
# Optionally builds a second variant with a merge reverted, to compare side by side.
on:
  workflow_dispatch:
    inputs:
      duckdb_ref:
        description: 'DuckDB ref to build (empty: the dispatched commit)'
        type: string
        default: ''
      variant:
        description: 'Which builds to run'
        type: choice
        options:
          - both
          - as-is
          - reverted
        default: both
      revert_merge:
        description: 'Merge commit reverted (git revert -m 1) in the "reverted" variant'
        type: string
        default: '65ba4dc57379a1a2a1e648047a016b354c64dc19'
      extension_set:
        description: 'main = same extensions as CI (slow build); httpfs = in-tree + httpfs + aws'
        type: choice
        options:
          - main
          - httpfs
        default: main
      test_filter:
        description: 'unittest filter ("*" is what CI runs)'
        type: string
        default: '*'
      iterations:
        description: 'How many times to run the test suite'
        type: string
        default: '10'
      stop_on_first_crash:
        description: 'Stop looping at the first crash'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  variants:
    name: Select variants
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          case "$VARIANT" in
            both) echo 'matrix=["as-is","reverted"]' >> $GITHUB_OUTPUT ;;
            *)    echo "matrix=[\"$VARIANT\"]" >> $GITHUB_OUTPUT ;;
          esac

  repro:
    name: Repro (${{ matrix.variant }})
    needs: variants
    runs-on: windows-11-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variants.outputs.matrix) }}
    env:
      VCPKG_TARGET_TRIPLET: arm64-windows-static-release
      VCPKG_HOST_TRIPLET: arm64-windows-static-release
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extension-ci-tools/toolchains
      VCPKG_BINARY_SOURCES: 'clear;http,https://vcpkg-cache.duckdb.org,read'
      USE_MERGED_VCPKG_MANIFEST: '1'
      BUILD_SHELL: '0'
      DUCKDB_PLATFORM: windows_arm64
      CC: cl
      CXX: cl
      GEN: ninja

    steps:
      - name: Keep \n line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # Same trick as .github/workflows/_extension_distribution.yml: piggy-back on extension-template
      - uses: actions/checkout@v4
        name: Checkout extension-template
        with:
          repository: duckdb/extension-template
          ref: main
          fetch-depth: 0
          submodules: 'recursive'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          choco install ninja jq winflexbison3 -y

      - uses: actions/checkout@v4
        name: Checkout extension-ci-tools
        with:
          path: 'extension-ci-tools'
          repository: duckdb/extension-ci-tools
          ref: v1.5-variegata

      - uses: actions/checkout@v4
        name: Checkout DuckDB
        with:
          path: 'duckdb'
          ref: ${{ inputs.duckdb_ref != '' && inputs.duckdb_ref || github.sha }}
          fetch-tags: true
          fetch-depth: 0

      - name: Revert merge
        if: matrix.variant == 'reverted'
        shell: bash
        env:
          REVERT_MERGE: ${{ inputs.revert_merge }}
        run: |
          git -C duckdb revert --no-commit -m 1 "$REVERT_MERGE"
          git -C duckdb diff --cached --stat

      - name: Show DuckDB version under test
        shell: bash
        run: |
          git -C duckdb log -1 --format='%H %s'
          git -C duckdb status --short

      - name: Setup shorter path for vcpkg
        run: |
          $basePath = Split-Path -Path (Split-path -Path $env:GITHUB_WORKSPACE -Parent) -Parent
          $vcpkgRoot = "$basePath/vcpkg"
          echo "VCPKG_WINDOWS_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_PATH=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35
          vcpkgGitURL: https://github.com/microsoft/vcpkg.git
          vcpkgDirectory: ${{ env.VCPKG_WINDOWS_ROOT }}

      - name: Inject extension config
        shell: bash
        env:
          EXTENSION_SET: ${{ inputs.extension_set }}
        run: |
          {
            echo -e "\n# Injected Extension Config"
            cat duckdb/.github/config/in_tree_extensions.cmake
            echo
            if [ "$EXTENSION_SET" = "main" ]; then
              cat duckdb/.github/config/out_of_tree_extensions.cmake
            else
              echo 'include("${EXTENSION_CONFIG_BASE_DIR}/aws.cmake")'
              echo 'include("${EXTENSION_CONFIG_BASE_DIR}/httpfs.cmake")'
            fi
          } >> ./extension_config.cmake
          cat ./extension_config.cmake

      - name: Build
        env:
          ENABLE_EXTENSION_AUTOINSTALL: 1
          ENABLE_EXTENSION_AUTOLOADING: 1
          DUCKDB_PLATFORM_RTOOLS: 0
        shell: cmd
        run: |
          if exist "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsarm64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsarm64.bat"
          ) else (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsarm64.bat"
          )
          REM Rename link.exe to link-git.exe to avoid conflicts with git supplied linker.
          mv "C:\Program Files\Git\usr\bin\link.exe" "C:\Program Files\Git\usr\bin\link-git.exe"
          make release

      - name: Run tests in a loop
        shell: bash
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
          ITERATIONS: ${{ inputs.iterations }}
          STOP_ON_FIRST_CRASH: ${{ inputs.stop_on_first_crash }}
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p repro_logs
          crashes=0
          failures=0
          runs=0
          for i in $(seq 1 "$ITERATIONS"); do
            runs=$i
            log=repro_logs/run_$i.log
            start=$(date +%s)
            set +e
            ./build/release/test/unittest.exe "$TEST_FILTER" > "$log" 2>&1
            rc=$?
            set -e
            echo "iteration $i: exit $rc in $(( $(date +%s) - start ))s"
            if grep -q "fatal error condition\|SIGSEGV\|Segmentation" "$log"; then
              crashes=$((crashes + 1))
              echo "::error::iteration $i crashed"
              grep -B12 -A3 "fatal error condition" "$log" | head -40
              if [ "$STOP_ON_FIRST_CRASH" = "true" ]; then
                break
              fi
            elif [ $rc -ne 0 ]; then
              failures=$((failures + 1))
              echo "::warning::iteration $i had test failures (exit $rc)"
              grep -A4 ": FAILED:" "$log" | head -20
            else
              rm "$log"
            fi
          done
          {
            echo "### $VARIANT"
            echo "- runs: $runs of $ITERATIONS, filter \`$TEST_FILTER\`"
            echo "- crashes: $crashes"
            echo "- runs with non-crash test failures: $failures"
          } >> $GITHUB_STEP_SUMMARY
          if [ $crashes -ne 0 ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-logs-${{ matrix.variant }}
          path: repro_logs/
          if-no-files-found: ignore
